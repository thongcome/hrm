<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ออฟไลน์ — HumanOk</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1b2a4a; color: #fff; text-align: center; padding: 24px;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Tahoma, sans-serif;
    }
    .card { max-width: 360px; }
    img { width: 88px; height: 88px; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    p { opacity: .82; line-height: 1.6; margin: 0 0 24px; }
    button {
      background: #ff6b1a; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 26px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.svg" alt="HumanOk" />
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>HumanOk ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อใช้งาน โปรดตรวจสอบสัญญาณของคุณแล้วลองใหม่อีกครั้ง</p>
    <button onclick="location.reload()">ลองใหม่</button>
  </div>
</body>
</html>
